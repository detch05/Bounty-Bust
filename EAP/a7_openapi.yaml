                  value: "/bounties/{bountyId}"
                302Failure:
                  description: "Invalid data, redirecting back to bounty page."
                  value: "/bounties/{bountyId}"

  /bounties/comments/{comment_id}/edit:
    get:
      operationId: "R407"
      summary: "R407: Comment edit form"
      description: "Get the comment edit form for the authenticated user. Access: USR, MOD, ADM"
      tags:
        - "M04: Comments"
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "OK. Commment Edit Form"
        "404":
          description: "Answer not found."
    post:
      operationId: "R405"
      summary: "R405: Edit a comment for a Bounty"
      description: "Update comment information submitted from the edit form. Access: OWN, MOD, ADM"
      tags:
        - "M04: Comments"
      parameters:
        - in: path
          name: comment_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                content:
                  type: string
              required:
                - content
      responses:
        "302":
          description: "Redirect after editing comment."
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: "Comment successfully updated, redirecting to bounty page."
                  value: "/bounties/{bounty_id}"
                302Failure:
                  description: "Invalid data, redirecting back to bounty page."
                  value: "/bounties/{bounty_id}"

  /bounties/comments/{comment_id}/delete:
    delete:
      operationId: "R406"
      summary: "R406: Delete Comment"
      description: "Delete an existing comment. Access: OWN, MOD, ADM"
      tags:
        - "M04: Comments"
      parameters:
        - in: path
          name: comment_id
          required: true
          schema:
            type: integer
      responses:
        "302":
          description: "Redirect after deleting comment."
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: "Comment deleted successfully, redirecting to bounty page."
                  value: "/bounties/{bounty_id}"
                302Failure:
                  description: "Failed to delete comment, redirecting back to bounty page."
                  value: "/bounties/{bounty_id}"
  /tags:
    get:
      operationId: "R501"
      summary: "R501: List of Tags"
      description: "Display of all tags. Access: PUB"
      tags:
        - "M05: Tags"
      responses:
        "200":
          description: "Tags successfully retrieved."
          content:
            application/json:
              schema:
              type : array
              items:
                $ref: '#/components/schemas/Tag'
          
  /tags/{Id}:
    get:
      operationId: "R502"
      summary: "R502: Tag Details"
      description: "Display the details of a specific tag. Access: PUB"
      tags:
        - "M05: Tags"
      parameters:
        - in: path
          name: Id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Tag details successfully retrieved."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
              
  /tags/create:
    get:
      operationId: "R503"
      summary: "R503: Tag creation form"
      description: "Get the tag creation form for the authenticated user. Access: ADM"
      tags:
        - "M05: Tags"
      responses:
        "200":
          description: "OK. Tag Create Form"
    post:
      operationId: "R504"
      summary: "R504: Create a new tag"
      description: "Process newly created tag from creation form. Access: ADM"
      tags:
        - "M05: Tags"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
              required:
                - name
                - description
      responses:
        "302":
          description: "Redirect after creating tag."
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: "Tag created successfully, redirecting to tag list."
                  value: "/tags"
                302Failure:
                  description: "Invalid data, redirecting back to creation form."
                  value: "/tags/create"
  /tags/{Id}/delete:
    post:
      operationId: "R505"
      summary: "R505: Delete Tag"
      description: "Delete an existing tag. Access: ADM"
      tags:
        - "M05: Tags"
      parameters:
        - in: path
          name: Id
          required: true
          schema:
            type: integer
      responses:
        "302":
          description: "Redirect after deleting tag."
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: "Tag deleted successfully, redirecting to tag list."
                  value: "/tags"
                302Failure:
                  description: "Failed to delete tag, redirecting back to tag page."
                  value: "/tags/{Id}"
  /tags/{Id}/edit:
    get:
      operationId: "R506"
      summary: "R506: Edit Tag Form"
      description: "Get the tag editing form for the authenticated user. Access: ADM"
      tags:
        - "M05: Tags"
      parameters:
        - in: path
          name: Id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "OK. Tag Edit Form"
        "404":
          description: "Tag not found."
    post:
      operationId: "R507"
      summary: "R507: Edit Tag Action"
      description: "Update tag information submitted from the tag edit form. Access: ADM"
      tags:
        - "M05: Tags"
      parameters:
        - in: path
          name: Id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
              required:
                - name
                - description
      responses:
        "302":
          description: "Redirect after editing tag."
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: "Tag successfully updated, redirecting to tag page."
                  value: "/tags/{Id}"
                302Failure:
                  description: "Invalid data, redirecting back to tag edit form."
                  value: "/tags/{Id}/edit"
  /tags/{Id}/follow:
    post:
