components:
  schemas:
    Content:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
          format: date
        description:
          type: string
        rating:
          type: number
          format: float
          default: 0
          minimum: 0
          maximum: 5
        user_id:
          type: integer
        version:
          type: integer
          default: 1
        edit_date:
          type: string
          format: date
      required:
        - id
        - date
        - description
        - rating
        - user_id
        - version
        - edit_date
    Bounty:
      allOf:
        - $ref: "#/components/schemas/Content"
        - type: object
          properties:
            title:
              type: string
            media:
              type: string
              format: binary
            reward:
              type: number
              default: 50
              minimum: 1
          required:
            - title
            - reward
    Answer:
      allOf:
        - $ref: "#/components/schemas/Content"
        - type: object
          properties:
            title:
              type: string
            media:
              type: string
              format: binary 
    Tag:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        ##color:
          ##type: string

    LeaderboardUser:
      type: object
      properties:
        userId:
          type: integer
        name:
          type: string
        points:
          type: integer
      required: [userId, name, points]

    Badge:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [bronze, silver, gold]
      required: [id, name, type]


          
